name: build
on:
  push:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Unit tests (non-blocking)
        run: gradle -p android testDebugUnitTest --no-daemon
        continue-on-error: true
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SnapToPrint-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Tests (non-blocking)
        run: dotnet test windows/SnapToPrint.Core.Tests/SnapToPrint.Core.Tests.csproj --logger "console;verbosity=normal"
        continue-on-error: true
      - name: Publish single-file EXE
        run: dotnet publish windows/SnapToPrint/SnapToPrint.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: SnapToPrint-Windows-EXE
          path: publish/SnapToPrint.exe
